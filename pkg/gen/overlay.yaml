overlay: 1.0.0
info:
  title: Trading212 type overrides
  version: 0.0.1
actions:
  # Pie details may return mixed encodings (number or ISO string), so map both
  # fields to a flexible custom type.
  - target: "$.components.schemas.AccountBucketDetailedResponse.properties.creationDate"
    description: Map pie creationDate to FlexibleDateTime
    update:
      x-go-type: FlexibleDateTime
  - target: "$.components.schemas.AccountBucketDetailedResponse.properties.endDate"
    description: Map pie endDate to FlexibleDateTime
    update:
      x-go-type: FlexibleDateTime
